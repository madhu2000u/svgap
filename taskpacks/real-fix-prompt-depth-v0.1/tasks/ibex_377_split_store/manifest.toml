schema_version = "2.0"
candidate_id = "ibex_377_split_store"

[design]
top = "split_store"
sources = ["design.sv"]

[functional]
commands = [
  ["iverilog", "-g2012", "-o", "${SVGAP_BUILD}/sim.vvp", "design.sv", "task-testbench.sv"],
  ["vvp", "${SVGAP_BUILD}/sim.vvp"],
]

[[oracles]]
id = "contract-property"
class = "temporal"
backend = "formal-yosys"
contributes_to_gap = true
required = true

[oracles.options]
property_sources = ["properties.sv"]
property_top = "split_store_properties"
depth = 10
rule_id = "REF-TEMP-001"
message = "split-store error is reported before the second half completes"

[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME", "-Wno-UNUSEDSIGNAL"]

[intent]

[output]
report = "report.json"
