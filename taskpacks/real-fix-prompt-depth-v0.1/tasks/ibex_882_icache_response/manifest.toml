schema_version = "2.0"
candidate_id = "ibex_882_icache_response"

[design]
top = "icache_response"
sources = ["design.sv"]

[functional]
commands = [
  ["iverilog", "-g2012", "-o", "${SVGAP_BUILD}/sim.vvp", "design.sv", "task-testbench.sv"],
  ["vvp", "${SVGAP_BUILD}/sim.vvp"],
]

[[oracles]]
id = "contract-property"
class = "protocol"
backend = "formal-yosys"
contributes_to_gap = true
required = true

[oracles.options]
property_sources = ["properties.sv"]
property_top = "icache_response_properties"
depth = 8
rule_id = "REF-PROT-001"
message = "buffered instruction response is not persistent under backpressure"

[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME", "-Wno-UNUSEDSIGNAL"]

[intent]

[output]
report = "report.json"
