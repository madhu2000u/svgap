[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME", "-Wno-UNUSEDSIGNAL"]

[intent]

[output]
report = "report.json"
