schema_version = "2.0"
candidate_id = "opentitan_26589_range_priority"

[design]
top = "range_priority"
sources = ["design.sv"]

[functional]
commands = [
  ["iverilog", "-g2012", "-o", "${SVGAP_BUILD}/sim.vvp", "design.sv", "task-testbench.sv"],
  ["vvp", "${SVGAP_BUILD}/sim.vvp"],
]

[[oracles]]
id = "synthesized-reference"
class = "equivalence"
backend = "equivalence-yosys"
contributes_to_gap = true
required = true

[oracles.options]
reference_sources = ["reference.sv"]
reference_top = "range_priority"
depth = 1
rule_id = "REF-EQUIV-001"
message = "post-synthesis access-control priority differs for overlapping ranges"

[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME", "-Wno-UNUSEDSIGNAL"]

[intent]

[output]
report = "report.json"
