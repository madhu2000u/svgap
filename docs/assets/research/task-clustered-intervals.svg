<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">Task-clustered sensitivity intervals</title>
<desc id="desc">Point estimates and 95 percent nonparametric task-cluster bootstrap percentile intervals for reset-release and expanded contract-oracle studies.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#8793A5"/>
  </marker>
  <style>
    text { font-family: Inter, "IBM Plex Sans", Helvetica, Arial, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-size: 16px; fill: #5E6B7D; }
    .heading { font-size: 17px; font-weight: 700; }
    .body { font-size: 15px; }
    .small { font-size: 13px; fill: #5E6B7D; }
    .tiny { font-size: 11px; fill: #5E6B7D; }
    .number { font-size: 25px; font-weight: 750; }
    .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
  </style>
</defs>
<rect width="1280" height="620" fill="#FFFFFF"/>
<text x="60" y="58" class="title" text-anchor="start">Recurrence is task-clustered, not 120 independent Bernoulli trials</text>
<text x="60" y="88" class="subtitle" text-anchor="start">All candidates from a sampled task move together. Intervals describe sensitivity to the finite task set, not population prevalence.</text>
<line x1="330.0" y1="145" x2="330.0" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="330.0" y="533" class="small" text-anchor="middle">0%</text>
<line x1="471.66666666666663" y1="145" x2="471.66666666666663" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="471.66666666666663" y="533" class="small" text-anchor="middle">10%</text>
<line x1="613.3333333333333" y1="145" x2="613.3333333333333" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="613.3333333333333" y="533" class="small" text-anchor="middle">20%</text>
<line x1="755.0" y1="145" x2="755.0" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="755.0" y="533" class="small" text-anchor="middle">30%</text>
<line x1="896.6666666666666" y1="145" x2="896.6666666666666" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="896.6666666666666" y="533" class="small" text-anchor="middle">40%</text>
<line x1="1038.3333333333335" y1="145" x2="1038.3333333333335" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="1038.3333333333335" y="533" class="small" text-anchor="middle">50%</text>
<line x1="1180.0" y1="145" x2="1180.0" y2="505" stroke="#E2E8F0" stroke-width="1"/>
<text x="1180.0" y="533" class="small" text-anchor="middle">60%</text>
<line x1="330" y1="505" x2="1180" y2="505" stroke="#AEB9C7" stroke-width="1"/>
<text x="60" y="233" class="heading" text-anchor="start">Reset-release</text>
<text x="60" y="260" class="small" text-anchor="start">8 tasks · 72 candidates</text>
<text x="60" y="284" class="small" text-anchor="start">14 / 57 determinate functional passes</text>
<line x1="454.9817251461991" y1="245" x2="937.1428571428571" y2="245" stroke="#356AE6" stroke-width="8"/>
<line x1="454.9817251461991" y1="232" x2="454.9817251461991" y2="258" stroke="#356AE6" stroke-width="3"/>
<line x1="937.1428571428571" y1="232" x2="937.1428571428571" y2="258" stroke="#356AE6" stroke-width="3"/>
<circle cx="677.953216374269" cy="245" r="12" fill="#356AE6" stroke="#FFFFFF" stroke-width="3"/>
<rect x="624.953216374269" y="190" width="106" height="32" rx="16" fill="#356AE6" stroke="#356AE6" stroke-width="1" opacity="1"/>
<text x="677.953216374269" y="211" class="heading" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">24.6%</text>
<text x="454.9817251461991" y="280" class="small" text-anchor="middle" fill="#356AE6" style="fill:#356AE6" font-weight="700">8.8%</text>
<text x="937.1428571428571" y="280" class="small" text-anchor="middle" fill="#356AE6" style="fill:#356AE6" font-weight="700">42.9%</text>
<text x="60" y="383" class="heading" text-anchor="start">Expanded contracts</text>
<text x="60" y="410" class="small" text-anchor="start">8 tasks · 48 candidates</text>
<text x="60" y="434" class="small" text-anchor="start">11 / 40 determinate functional passes</text>
<line x1="433.6585365853658" y1="395" x2="1021.0569105691058" y2="395" stroke="#D7653B" stroke-width="8"/>
<line x1="433.6585365853658" y1="382" x2="433.6585365853658" y2="408" stroke="#D7653B" stroke-width="3"/>
<line x1="1021.0569105691058" y1="382" x2="1021.0569105691058" y2="408" stroke="#D7653B" stroke-width="3"/>
<circle cx="719.5833333333334" cy="395" r="12" fill="#D7653B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="666.5833333333334" y="340" width="106" height="32" rx="16" fill="#D7653B" stroke="#D7653B" stroke-width="1" opacity="1"/>
<text x="719.5833333333334" y="361" class="heading" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">27.5%</text>
<text x="433.6585365853658" y="430" class="small" text-anchor="middle" fill="#D7653B" style="fill:#D7653B" font-weight="700">7.3%</text>
<text x="1021.0569105691058" y="430" class="small" text-anchor="middle" fill="#D7653B" style="fill:#D7653B" font-weight="700">48.8%</text>
<text x="60" y="582" class="small" text-anchor="start">Method: 100,000-replicate nonparametric bootstrap over whole task clusters; percentile interval; fixed seed 20260824.</text>
</svg>
