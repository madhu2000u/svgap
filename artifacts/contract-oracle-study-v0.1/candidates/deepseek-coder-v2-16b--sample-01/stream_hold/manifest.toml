schema_version = "2.0"
candidate_id = "stream_hold"

[design]
top = "stream_hold"
sources = ["design.sv"]

[functional]
commands = [
  ["iverilog", "-g2012", "-o", "${SVGAP_BUILD}/sim.vvp", "design.sv", "tb.sv"],
  ["vvp", "${SVGAP_BUILD}/sim.vvp"],
]

[[oracles]]
id = "contract-property"
class = "protocol"
backend = "formal-yosys"
contributes_to_gap = true
required = true

[oracles.options]
property_sources = ["properties.sv"]
property_top = "stream_hold_properties"
depth = 10
rule_id = "REF-PROT-001"
message = "output valid or payload changes while the stream is backpressured"

[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME"]

[intent]

[output]
report = "report.json"
