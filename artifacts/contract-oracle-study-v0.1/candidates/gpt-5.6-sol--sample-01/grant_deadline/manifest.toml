schema_version = "2.0"
candidate_id = "grant_deadline"

[design]
top = "grant_deadline"
sources = ["design.sv"]

[functional]
commands = [
  ["iverilog", "-g2012", "-o", "${SVGAP_BUILD}/sim.vvp", "design.sv", "tb.sv"],
  ["vvp", "${SVGAP_BUILD}/sim.vvp"],
]

[[oracles]]
id = "contract-property"
class = "temporal"
backend = "formal-yosys"
contributes_to_gap = true
required = true

[oracles.options]
property_sources = ["properties.sv"]
property_top = "grant_deadline_properties"
depth = 10
rule_id = "REF-TEMP-001"
message = "an accepted request does not receive a grant within two cycles"

[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME"]

[intent]

[output]
report = "report.json"
